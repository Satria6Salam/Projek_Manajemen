# Penjaga regresi: setiap push / pull request menjalankan semua tes backend & aplikasi,
# termasuk uji akurasi ekstraksi struk dengan Tesseract sungguhan. Bila akurasi turun
# di bawah batas (tests/test_extraction_accuracy.py), alur ini gagal (tanda merah).
name: Tes STRUKKU

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + akurasi struk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Pasang Tesseract OCR (bahasa Indonesia & Inggris) dan font uji
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ind tesseract-ocr-eng fonts-dejavu-core libgl1 libglib2.0-0
          tesseract --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Pasang dependensi
        run: pip install -r requirements-dev.txt
      - name: Tes backend
        run: pytest -q
      - name: Uji akurasi ekstraksi struk (penjaga regresi)
        env:
          RUN_SLOW: "1"
        run: pytest -q -s tests/test_extraction_accuracy.py

  mobile:
    name: Aplikasi (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ambil paket
        run: flutter pub get
      - name: Analisis kode
        run: flutter analyze --no-fatal-infos
      - name: Tes aplikasi
        run: flutter test
